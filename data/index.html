<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32Wx 설정</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>🌤️ ESP32Wx 설정</h1>

        <div id="status"></div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="wifi">WiFi</button>
            <button class="tab-btn" data-tab="system">System</button>
            <button class="tab-btn" data-tab="pictures">Pictures</button>
        </div>

        <!-- ================= WiFi 탭 ================= -->
        <section id="tab-wifi" class="tab-panel active">
            <form id="configForm">
                <div class="form-group">
                    <label for="ssid">WiFi 네트워크:</label>
                    <button type="button" class="scan-btn" id="scanBtn">WiFi 스캔</button>
                    <input type="text" id="ssid" name="ssid" placeholder="WiFi SSID 입력" required>
                    <div id="wifiList" style="display: none;"></div>
                </div>

                <div class="form-group">
                    <label for="password">WiFi 비밀번호:</label>
                    <input type="password" id="password" name="password" placeholder="WiFi 패스워드 입력">
                </div>

                <div class="form-group">
                    <label for="apiKey">날씨 API 키:</label>
                    <input type="text" id="apiKey" name="apiKey" placeholder="OpenWeatherMap API 키">
                    <small>OpenWeatherMap에서 무료 API 키를 받으세요: <a href="https://openweathermap.org/api" target="_blank">openweathermap.org/api</a></small>
                </div>

                <div class="form-group">
                    <label for="cityName">도시명:</label>
                    <input type="text" id="cityName" name="cityName" placeholder="예: Seoul, Tokyo, New York" value="Seoul">
                </div>

                <button type="submit">설정 저장</button>
            </form>
            <p class="hint">설정이 완료되면 디바이스가 재시작됩니다.</p>
        </section>

        <!-- ================= System 탭 ================= -->
        <section id="tab-system" class="tab-panel">
            <div class="card" id="statusCard">
                <div class="status-row"><span>WiFi</span><span id="statWifi">-</span></div>
                <div class="status-row"><span>SD 카드</span><span id="statSd">-</span></div>
                <div class="status-row"><span>펌웨어 버전</span><span id="statVersion">-</span></div>
            </div>

            <h3>디스플레이</h3>
            <div class="form-group">
                <label for="brightness">밝기: <span id="brightnessVal">80</span>%</label>
                <input type="range" id="brightness" min="0" max="100" value="80">
            </div>
            <div class="form-group">
                <label>화면 회전:</label>
                <div class="btn-row" id="rotationBtns">
                    <button type="button" class="chip" data-rot="0">0°</button>
                    <button type="button" class="chip" data-rot="90">90°</button>
                    <button type="button" class="chip" data-rot="180">180°</button>
                    <button type="button" class="chip" data-rot="270">270°</button>
                </div>
            </div>
            <div class="form-group">
                <label for="timezone">타임존 (POSIX TZ):</label>
                <input type="text" id="timezone" placeholder="예: KST-9">
            </div>

            <h3>야간 감광</h3>
            <div class="form-group">
                <label class="switch-label"><input type="checkbox" id="nightDimEnabled"> 야간 자동 감광 사용</label>
            </div>
            <div class="form-group two-col">
                <div>
                    <label for="nightDimStart">시작 시각</label>
                    <select id="nightDimStart"></select>
                </div>
                <div>
                    <label for="nightDimEnd">종료 시각</label>
                    <select id="nightDimEnd"></select>
                </div>
            </div>
            <button type="button" id="saveSystemBtn">시스템 설정 저장</button>

            <h3>펌웨어 업데이트 (OTA)</h3>
            <div class="form-group">
                <label for="otaUrl">매니페스트 URL:</label>
                <input type="text" id="otaUrl" placeholder="https://.../manifest.json">
            </div>
            <div class="btn-row">
                <button type="button" id="otaSaveBtn">URL 저장</button>
                <button type="button" id="otaCheckBtn">업데이트 확인</button>
                <button type="button" id="otaStartBtn" disabled>지금 업데이트</button>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="otaProgress"></div></div>
            <p id="otaStatus" class="hint">-</p>
        </section>

        <!-- ================= Pictures 탭 ================= -->
        <section id="tab-pictures" class="tab-panel">
            <div class="form-group">
                <label class="switch-label"><input type="checkbox" id="slideshowEnabled"> 슬라이드쇼 사용</label>
            </div>
            <div class="form-group">
                <label for="slideshowInterval">전환 간격 (초): <span id="slideshowIntervalVal">5</span>s</label>
                <input type="range" id="slideshowInterval" min="1" max="60" value="5">
            </div>
            <button type="button" id="savePicturesBtn">Pictures 설정 저장</button>

            <h3>SD 카드 사진 (/photos)</h3>
            <div id="fileList" class="file-list">불러오는 중...</div>
            <p class="hint">SD 카드를 PC에 연결해 /photos 폴더에 jpg/png/gif 파일을 넣어주세요.</p>
        </section>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
